[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sick-3d-lidar"
version = "0.1.0"
description = "Analyze SICK 3D LiDAR raw data and reconstruct vehicle shapes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
detect = ["scipy>=1.10"]

[project.scripts]
sick-3d-lidar = "sick_3d_lidar.__main__:main"

[tool.setuptools]
package-dir = {"" = "src/main/python"}

[tool.setuptools.packages.find]
where = ["src/main/python"]
